      <path d="M528 292c-10-70 30-116 84-116 40 0 62 14 74 36 18 20 18 52 8 82-8-36-26-56-50-60-34 16-82 18-116 58z" fill="#C8772E"/>
      <path d="M560 196c16-22 44-30 72-26 26 4 46 18 56 40-30-14-78-18-128-14z" fill="#D88A3A"/>
