        <rect x="211" y="408" width="60" height="120" rx="9" fill="#2F6B58"/>
        <rect x="220" y="422" width="42" height="8" rx="4" fill="#B9E4C9"/>
        <rect x="220" y="440" width="28" height="6" rx="3" fill="#fff" opacity="0.7"/>
        <rect x="220" y="454" width="36" height="6" rx="3" fill="#fff" opacity="0.5"/>
