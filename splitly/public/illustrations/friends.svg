      <g transform="rotate(10 724 470)">
        <rect x="688" y="398" width="74" height="136" rx="14" fill="#8E969A"/>
        <rect x="695" y="406" width="60" height="120" rx="9" fill="#EEF2EF"/>
        <rect x="704" y="420" width="42" height="8" rx="4" fill="#2F6B58"/>
        <rect x="704" y="438" width="30" height="6" rx="3" fill="#A5B5AA"/>
        <rect x="704" y="452" width="38" height="6" rx="3" fill="#C9D3CC"/>
