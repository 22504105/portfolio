<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Four friends looking at a shared bill on their phones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EFE3"/>
      <stop offset="1" stop-color="#E6F1E6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F4EE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173D35" flood-opacity="0.18"/>
    </filter>
    <clipPath id="frame"><rect width="960" height="600" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
