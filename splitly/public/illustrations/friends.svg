      <path d="M740 294c8-6 20-6 28-1M796 293c8-5 20-5 28 1" fill="none" stroke="#4A2A1C" stroke-width="4" stroke-linecap="round"/>
      <path d="M760 348c14 14 32 14 46 0" fill="#fff" stroke="#8A4A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="738" cy="340" r="11" fill="#E89C8C" opacity="0.45"/>
      <circle cx="828" cy="340" r="11" fill="#E89C8C" opacity="0.45"/>
