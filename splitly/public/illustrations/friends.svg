    <circle cx="150" cy="110" r="150" fill="#B9E4C9" opacity="0.35"/>
    <circle cx="840" cy="90" r="110" fill="#F4D9B8" opacity="0.45"/>
    <circle cx="500" cy="640" r="260" fill="#FFFFFF" opacity="0.4"/>

