    <!-- The bill they are splitting -->
    <g transform="rotate(-4 480 470)" filter="url(#soft)">
      <rect x="340" y="318" width="280" height="330" rx="18" fill="url(#paper)"/>
      <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" fill="#232826">
        <text x="368" y="372">Coffee</text><text x="592" y="372" text-anchor="end">2.50</text>
        <text x="368" y="416">Pizza</text><text x="592" y="416" text-anchor="end">18.00</text>
        <text x="368" y="460">Taxi</text><text x="592" y="460" text-anchor="end">12.00</text>
        <text x="368" y="504">Groceries</text><text x="592" y="504" text-anchor="end">45.00</text>
        <path d="M368 528h224" stroke="#CDD4CC" stroke-width="2" stroke-dasharray="6 6"/>
        <text x="368" y="570" font-weight="700" font-size="28">Total</text><text x="592" y="570" text-anchor="end" font-weight="700" font-size="28">77.50</text>
